# Telegraf Configuration - BIPL Realtime Datastreaming
# Aligned with Python mqtt_collector.py — all 6 device MQTT topics
# Measurements: device_telemetry, device_alerts, device_heartbeat,
#               device_diagnostics, device_config_ack

[global_tags]
  environment = "production"
  project     = "realtime-datastreaming"
  collector   = "telegraf"

[agent]
  interval             = "1s"
  round_interval       = true
  metric_batch_size    = 1000
  metric_buffer_limit  = 20000
  collection_jitter    = "0s"
  flush_interval       = "1s"
  flush_jitter         = "0s"
  precision            = "1ns"   # nanosecond precision to match Python collector
  omit_hostname        = false
  debug                = false


# ──────────────────────────────────────────────────────────────────────────────
# INPUT 1: Telemetry  →  device/data/{uuid}  →  device_telemetry
# ──────────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers            = ["tcp://${MQTT_BROKER_HOST}:${MQTT_BROKER_PORT}"]
  topics             = ["device/data/+"]
  qos                = 1
  client_id          = "telegraf-telemetry"
  connection_timeout = "30s"
  username           = "${MQTT_USERNAME}"
  password           = "${MQTT_PASSWORD}"
  persistent_session = false

  data_format       = "json"
  json_time_key     = "timestamp"
  json_time_format  = "unix"
  name_override     = "device_telemetry"

  # Top-level tags
  tag_keys = ["device_id"]

  # Nested: detection.label  →  tag
  json_string_fields = [
    "detection_label",      # detection.label flattened by telegraf as detection_label
  ]


# ──────────────────────────────────────────────────────────────────────────────
# INPUT 2: Alerts  →  device/alerts/{uuid}  →  device_alerts
# ──────────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers            = ["tcp://${MQTT_BROKER_HOST}:${MQTT_BROKER_PORT}"]
  topics             = ["device/alerts/+"]
  qos                = 1
  client_id          = "telegraf-alerts"
  connection_timeout = "30s"
  username           = "${MQTT_USERNAME}"
  password           = "${MQTT_PASSWORD}"
  persistent_session = false

  data_format      = "json"
  json_time_key    = "timestamp"
  json_time_format = "unix"
  name_override    = "device_alerts"

  tag_keys = ["device_id", "alert_type", "severity"]

  json_string_fields = ["detection_label", "details"]


# ──────────────────────────────────────────────────────────────────────────────
# INPUT 3: Heartbeat  →  device/status/{uuid}  →  device_heartbeat
# ──────────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers            = ["tcp://${MQTT_BROKER_HOST}:${MQTT_BROKER_PORT}"]
  topics             = ["device/status/+"]
  qos                = 1
  client_id          = "telegraf-heartbeat"
  connection_timeout = "30s"
  username           = "${MQTT_USERNAME}"
  password           = "${MQTT_PASSWORD}"
  persistent_session = true   # retain = YES for heartbeat
  retained           = true

  data_format      = "json"
  json_time_key    = "timestamp"
  json_time_format = "unix"
  name_override    = "device_heartbeat"

  tag_keys           = ["device_id"]
  json_string_fields = ["status"]


# ──────────────────────────────────────────────────────────────────────────────
# INPUT 4: Diagnostics  →  device/diag/{uuid}  →  device_diagnostics
# ──────────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers            = ["tcp://${MQTT_BROKER_HOST}:${MQTT_BROKER_PORT}"]
  topics             = ["device/diag/+"]
  qos                = 1
  client_id          = "telegraf-diagnostics"
  connection_timeout = "30s"
  username           = "${MQTT_USERNAME}"
  password           = "${MQTT_PASSWORD}"
  persistent_session = false

  data_format      = "json"
  json_time_key    = "timestamp"
  json_time_format = "unix"
  name_override    = "device_diagnostics"

  tag_keys           = ["device_id"]
  json_string_fields = ["firmware_version"]


# ──────────────────────────────────────────────────────────────────────────────
# INPUT 5: Config Ack  →  device/config_ack/{uuid}  →  device_config_ack
# ──────────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers            = ["tcp://${MQTT_BROKER_HOST}:${MQTT_BROKER_PORT}"]
  topics             = ["device/config_ack/+"]
  qos                = 1
  client_id          = "telegraf-config-ack"
  connection_timeout = "30s"
  username           = "${MQTT_USERNAME}"
  password           = "${MQTT_PASSWORD}"
  persistent_session = false

  data_format      = "json"
  json_time_key    = "timestamp"
  json_time_format = "unix"
  name_override    = "device_config_ack"

  tag_keys           = ["device_id", "status"]
  json_string_fields = ["message"]


# ──────────────────────────────────────────────────────────────────────────────
# PROCESSOR: Telemetry — promote nested detection.label to tag, flatten GPS
# Applies only to device_telemetry measurement
# ──────────────────────────────────────────────────────────────────────────────
[[processors.starlark]]
  namepass = ["device_telemetry"]
  source = '''
def apply(metric):
    # Move detection_label field → tag (matches Python collector schema)
    if "detection_label" in metric.fields:
        metric.tags["detection_label"] = str(metric.fields["detection_label"])
        metric.fields.pop("detection_label")

    # Clamp speed 0–300 km/h
    if "speed" in metric.fields:
        spd = float(metric.fields["speed"])
        if spd < 0.0:
            metric.fields["speed"] = 0.0
        elif spd > 300.0:
            metric.fields["speed"] = 300.0

    return metric
'''


# ──────────────────────────────────────────────────────────────────────────────
# PROCESSOR: Alerts — promote alert_type and severity to tags
# ──────────────────────────────────────────────────────────────────────────────
[[processors.starlark]]
  namepass = ["device_alerts"]
  source = '''
def apply(metric):
    # Clamp speed
    if "speed" in metric.fields:
        spd = float(metric.fields["speed"])
        metric.fields["speed"] = max(0.0, min(spd, 300.0))
    return metric
'''


# ──────────────────────────────────────────────────────────────────────────────
# OUTPUT: InfluxDB v2
# ──────────────────────────────────────────────────────────────────────────────
[[outputs.influxdb_v2]]
  urls         = ["${INFLUXDB_URL}"]
  token        = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket       = "${INFLUXDB_BUCKET}"
  timeout      = "5s"
  content_encoding = "gzip"


# ──────────────────────────────────────────────────────────────────────────────
# OPTIONAL: System metrics for the collector host
# ──────────────────────────────────────────────────────────────────────────────
[[inputs.cpu]]
  percpu      = false
  totalcpu    = true
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# System Disk I/O metrics
[[inputs.diskio]]

# System Network metrics
[[inputs.net]]

# System Kernel metrics
[[inputs.kernel]]

# System Process metrics
[[inputs.processes]]

