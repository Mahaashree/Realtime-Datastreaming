services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - datastreaming-network
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=vehicle-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
      # Performance Tuning - OPTIMIZED TO REDUCE COMPACTION LATENCY
      - INFLUXD_ENGINE_MAX_CONCURRENT_COMPACTIONS=1  # REDUCED from 4: Only 1 compaction at a time to reduce latency spikes
      - INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE=4294967296  # 4GB cache (increased from 2GB) to reduce flush frequency
      - INFLUXD_STORAGE_CACHE_SNAPSHOT_MEMORY_SIZE=104857600  # 100MB snapshot size (increased from default 25MB)
      - INFLUXD_STORAGE_CACHE_SNAPSHOT_WRITE_COLD_DURATION=30m  # Wait 30min before snapshot (default: 10m)
      - INFLUXD_STORAGE_WAL_FSYNC_DELAY=200ms  # Batch WAL writes over 200ms (increased from 100ms)
      - INFLUXD_STORAGE_COMPACT_FULL_WRITE_COLD_DURATION=8h  # Full compaction every 8h (default: 4h)
      - INFLUXD_STORAGE_COMPACT_THROUGHPUT=52428800  # Limit compaction speed to 50MB/s
      - INFLUXD_STORAGE_COMPACT_THROUGHPUT_BURST=62914560  # Burst to 60MB/s
      - INFLUXD_STORAGE_MAX_CONCURRENT_WRITES=64  # REDUCED from 128: Prevent overload
      - INFLUXD_HTTP_WRITE_TIMEOUT=30s  # Keep write timeout at 30s
      - INFLUXD_QUERY_CONCURRENCY=8  # REDUCED from 16: Leave more resources for writes
      - INFLUXD_QUERY_QUEUE_SIZE=64  # REDUCED from 128
    volumes:
      - influxdb-data:/var/lib/influxdb2
      # Optional: Use tmpfs for WAL for faster writes (data loss risk on crash)
      # - type: tmpfs
      #   target: /var/lib/influxdb2/wal
      #   tmpfs:
      #     size: 1G
    networks:
      - datastreaming-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4" # Allocate 4 CPU cores
          memory: 8G # Allocate 8GB RAM
        reservations:
          cpus: "2" # Reserve minimum 2 cores
          memory: 4G # Reserve minimum 4GB RAM

  # Telegraf - Optional: Uncomment to use Telegraf instead of Python collector
  # See TELEGRAF.md for benefits and setup instructions
  # telegraf:
  #   image: telegraf:1.28
  #   container_name: telegraf
  #   user: root  # Required for Docker socket access (or disable Docker input in config)
  #   volumes:
  #     - ../telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   environment:
  #     - INFLUXDB_URL=http://influxdb:8086
  #     - INFLUXDB_TOKEN=my-super-secret-auth-token
  #     - INFLUXDB_ORG=my-org
  #     - INFLUXDB_BUCKET=vehicle-data
  #     - MQTT_BROKER_HOST=mosquitto
  #     - MQTT_BROKER_PORT=1883
  #   depends_on:
  #     - influxdb
  #     - mosquitto
  #   networks:
  #     - datastreaming-network
  #   restart: unless-stopped

volumes:
  influxdb-data:

networks:
  datastreaming-network:
    driver: bridge
