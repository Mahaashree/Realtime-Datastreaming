# InfluxDB Configuration - Optimized for Low Latency
# This configuration reduces compaction-induced write latency spikes

[meta]
  dir = "/var/lib/influxdb/meta"

[data]
  dir = "/var/lib/influxdb/data"
  wal-dir = "/var/lib/influxdb/wal"
  
  # Cache Settings - Reduce flush frequency to minimize disruptions
  cache-max-memory-size = "1g"                      # Allow more caching before flush
  cache-snapshot-memory-size = "50m"                # Increase from default 25m
  cache-snapshot-write-cold-duration = "30m"        # Wait 30min before snapshot (default: 10m)
  
  # TSM Compaction Settings - Make compaction less aggressive
  compact-full-write-cold-duration = "8h"           # Full compaction every 8h (default: 4h)
  compact-throughput = "50mb"                       # Limit compaction speed to 50MB/s
  compact-throughput-burst = "60mb"                 # Allow burst up to 60MB/s
  max-concurrent-compactions = 1                    # Only 1 compaction at a time (reduces CPU)
  
  # Series and Index Settings
  max-series-per-database = 1000000                 # Reasonable limit
  max-values-per-tag = 100000                       # Reasonable limit
  
  # Query Settings
  query-timeout = "0s"                              # No timeout
  max-concurrent-queries = 0                        # No limit
  
[coordinator]
  # Write timeout
  write-timeout = "30s"                             # Increase from default 10s
  max-concurrent-queries = 0                        # No limit on concurrent queries
  query-timeout = "0s"                              # No timeout
  
[retention]
  # Retention policy enforcement
  enabled = true
  check-interval = "30m"                            # Check every 30min

[http]
  # HTTP settings
  enabled = true
  bind-address = ":8086"
  auth-enabled = false
  max-row-limit = 0                                 # No limit
  
[logging]
  # Logging
  level = "info"
